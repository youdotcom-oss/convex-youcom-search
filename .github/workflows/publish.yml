name: Publish Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump. 'none' publishes the version already in package.json (first release)."
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
          - none

permissions:
  contents: read

jobs:
  update-version:
    name: Update Version
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compute version
        id: version
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          CURRENT=$(jq -r '.version' package.json)
          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT%%-*}"
          case "$BUMP" in
            major) VERSION="$((MAJOR + 1)).0.0" ;;
            minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
            patch) VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            none) VERSION="$CURRENT" ;;
            *) echo "::error::Invalid bump: $BUMP"; exit 1 ;;
          esac
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version: $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build, check and test
        run: |
          bun run build
          bun run check
          bun run test

      - name: Commit version bump
        id: commit
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ACTOR: ${{ github.actor }}
        run: |
          if [[ "$(jq -r '.version' package.json)" != "$VERSION" ]]; then
            jq --arg v "$VERSION" '.version = $v' package.json > package.json.tmp
            mv package.json.tmp package.json
            git config user.name "$ACTOR"
            git config user.email "$ACTOR@users.noreply.github.com"
            git add package.json
            git commit -m "ci: publish v$VERSION [skip ci]"
            git push origin main
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  npm-publish:
    name: Publish to npm
    needs: update-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.update-version.outputs.sha }}

      - name: Setup Node.js for npm trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Publish
        run: npm publish --provenance --access public

  create-release:
    name: Create GitHub Release
    needs: [update-version, npm-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.update-version.outputs.version }}
          SHA: ${{ needs.update-version.outputs.sha }}
        run: gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "v$VERSION" --generate-notes
